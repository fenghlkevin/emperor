const byId=Object.fromEntries(effects.map(e=>[e.id,e])),positive=['attack','temp','health','shield'],negative=['freeze','silence','weak','frail'],mixed=[...positive,...negative],all=effects.map(e=>e.id),presets={positive,negative,mixed,all};

const units=Array.from({length:14},(_,i)=>({id:(i<7?'enemy-':'home-')+(i%7),side:i<7?'enemy':'home',name:names[i%7],art:assets.people[i%assets.people.length],keys:i===10?[...mixed]:i%3===0?['attack','freeze','shield']:i%3===1?['health','temp']:['weak','silence']}));
const unit=()=>units.find(u=>u.id===selected),keys=()=>unit().keys,sign=n=>n>0?'+'+n:'−'+Math.abs(n),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function glyph(e){return `<span class="r-glyph" aria-hidden="true"><i data-lucide="${e.icon}"></i><span class="r-glyph-fallback">${e.short}</span></span>`;}
function icons(){if(globalThis.lucide)lucide.createIcons({root,attrs:{width:17,height:17}});}
function stats(u){const list=u.keys.map(k=>byId[k]);const attack=3+list.filter(e=>e.target==='attack').reduce((a,e)=>a+e.value,0),max=7+list.filter(e=>e.target==='health').reduce((a,e)=>a+e.value,0);return {attack,max,hp:Math.max(1,max-4),attackParts:list.filter(e=>e.target==='attack').map(e=>sign(e.value)),healthParts:list.filter(e=>e.target==='health').map(e=>sign(e.value))};}
function badge(u,e){return `<button class="r-badge ${e.negative?'negative':''}" data-badge="${e.id}" data-owner="${u.id}" aria-label="${esc(e.name+(e.value?' '+sign(e.value):'')+'，'+e.expiry)}" aria-pressed="${selected===u.id&&focused===e.id}" data-tooltip="${esc(e.name+(e.value?' '+sign(e.value):'')+' · '+e.expiry)}">${glyph(e)}${e.value?`<span class="r-badge-value">${sign(e.value)}</span>`:''}${e.temporary?'<span class="r-time" aria-hidden="true">⌛</span>':''}</button>`;}
function card(u){const s=stats(u),chosen=u.id===selected,groups=[false,true].map(neg=>{const list=effects.filter(e=>e.negative===neg&&u.keys.includes(e.id));return list.length?`<section class="r-group ${neg?'negative':''}" aria-label="${neg?'负面':'增益'} ${list.length} 项"><div class="r-group-label"><span>${neg?'负面':'增益'}</span><span>${list.length}</span></div><div class="r-badges">${list.map(e=>badge(u,e)).join('')}</div></section>`:'';}).join('');return `<article class="r-unit" data-unit="${u.id}" aria-label="${u.name}，${u.keys.length} 项状态"><button class="r-card" data-select="${u.id}" aria-pressed="${chosen}" aria-label="查看${u.side==='home'?'我方':'敌方'}${u.name}"><div class="r-picture" style="background-image:url('${u.art}')"><span class="r-stamp">${u.side==='home'?'我军':'敌军'}</span></div><strong class="r-name">${u.name}</strong><div class="r-stats"><span class="r-atk ${s.attack>3?'up':s.attack<3?'down':''}">攻 ${s.attack}</span><span class="r-hp">${s.hp} / ${s.max}</span></div></button><div class="r-dock" aria-label="全部状态">${groups||'<div class="r-empty">无附加状态</div>'}</div>${scene==='single'?'<div class="r-unit-caption">点击任意徽记，查看单项效果</div>':''}</article>`;}
function renderField(){if(scene==='single'){field.innerHTML=`<div class="r-single"><div class="r-spot"></div>${card(unit())}</div>`;}else{field.innerHTML=`<div class="r-board"><div class="r-commander"><b>敌方主将 · 生命 25 · 护甲 3</b><span class="r-aux"><span>武器 3 / 耐久 2</span><span>未知奥秘 ×2</span></span></div>${['enemy','home'].map(side=>`<section class="r-army"><div class="r-army-label"><span>${side==='home'?'我军':'敌军'}阵列</span><span>7 张部队${scene==='stress'?' · 每张 8 项起始状态':''}</span></div><div class="r-army-grid">${units.filter(u=>u.side===side).map(card).join('')}</div></section>`).join('')}<div class="r-board-footer"><span>我方主将 · 生命 28 · 护甲 2</span><span>武器 2 / 耐久 2 · 己方奥秘 ×2 · 地标余 1 次 / 冷却</span></div></div>`;}}
function renderInspector(){const u=unit(),s=stats(u);root.querySelector('[data-unit-title]').textContent=(u.side==='home'?'我军 · ':'敌军 · ')+u.name;root.querySelector('[data-unit-stats]').textContent=`攻击 ${s.attack}   生命 ${s.hp} / ${s.max}`;root.querySelector('[data-action-state]').textContent=u.keys.includes('freeze')?'当前无法攻击：冻结':'当前无冻结限制';root.querySelector('[data-count]').textContent=`${u.keys.length} 项状态全部显示`;root.querySelector('[data-picker]').innerHTML=effects.map(e=>`<button class="r-effect-choice ${e.negative?'negative':''}" data-toggle="${e.id}" aria-pressed="${u.keys.includes(e.id)}" aria-label="${u.keys.includes(e.id)?'移除':'添加'}${e.name}">${glyph(e)}<span>${e.name}${e.value?' '+sign(e.value):''}</span></button>`).join('');if(!u.keys.includes(focused))focused=u.keys[0]??null;const e=byId[focused];root.querySelector('[data-detail]').innerHTML=e?`<div class="r-detail-title"><b>${e.name}${e.value?' '+sign(e.value):''}</b><span class="r-sub">${e.negative?'负面':'增益'}</span></div><p>${e.description}</p><p><strong>来源</strong>　${e.source.map(([n,v])=>esc(n)+(v===null?'':' '+sign(v))).join('；')}</p><p><strong>期限</strong>　${e.expiry}</p><button class="r-action" data-remove="${e.id}">只移除这一项</button>`:'<div class="r-detail-title"><b>没有附加状态</b></div><p>点击上方状态，自由组合。</p>';root.querySelector('[data-math]').innerHTML=`<div class="r-equation">3 ${s.attackParts.join(' ')} = ${s.attack}</div><div>生命上限：7 ${s.healthParts.join(' ')} = ${s.max}</div><div>当前生命：${s.hp} / ${s.max}</div>`;}
function render(){shell.dataset.scene=scene;root.querySelectorAll('[data-scene]').forEach(b=>{if(b.tagName==='BUTTON')b.setAttribute('aria-pressed',b.dataset.scene===scene);});root.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed',presets[b.dataset.preset].length===keys().length&&presets[b.dataset.preset].every(k=>keys().includes(k))));renderInspector();renderField();icons();resize();}
function say(s){root.querySelector('[data-live]').textContent=s;root.querySelector('[data-phase]').textContent=s;}
function stop(){cancelAnimationFrame(raf);playing=false;ctx.clearRect(0,0,canvas.width,canvas.height);root.querySelector('[data-play]').textContent='重放施加';root.querySelector('[data-play]').disabled=false;}
function persist(){window.openai?.setWidgetState?.({modelContent:{scene,selected,focused,activeStates:[...keys()]},privateContent:{units:units.map(u=>({id:u.id,keys:u.keys})),speed}})?.catch(()=>{});}
function toggle(id){stop();const u=unit(),has=u.keys.includes(id);u.keys=has?u.keys.filter(k=>k!==id):effects.map(e=>e.id).filter(k=>u.keys.includes(k)||k===id);if(!has)focused=id;render();say((has?'已移除 ':'已添加 ')+byId[id].name+'，其余状态保留');persist();if(!has)animate([id]);}
root.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b||!root.contains(b))return;if(b.dataset.scene){stop();scene=b.dataset.scene;if(scene==='stress')for(const u of units)u.keys=[...mixed];render();say(scene==='stress'?'双方各七张牌，每张八项状态；仍可点击卡牌逐个编辑':'可选择卡牌与状态查看详情');persist();return;}if(b.dataset.preset){stop();unit().keys=[...presets[b.dataset.preset]];focused=unit().keys[0]??null;render();say(`${unit().keys.length} 项状态，正负效果分别排列`);persist();return;}if(b.dataset.toggle){toggle(b.dataset.toggle);return;}if(b.dataset.remove){toggle(b.dataset.remove);return;}if(b.dataset.select){stop();selected=b.dataset.select;render();say(`已选择${unit().side==='home'?'我军':'敌军'}${unit().name}`);persist();return;}if(b.dataset.badge){stop();selected=b.dataset.owner;focused=b.dataset.badge;render();say('正在查看 '+byId[focused].name);persist();return;}if(b.hasAttribute('data-play')){animate([...keys()]);return;}if(b.hasAttribute('data-turn')){stop();const expiring=['temp','freeze'].filter(k=>keys().includes(k));unit().keys=keys().filter(k=>!expiring.includes(k));render();say(expiring.length?'示例己方回合结束：'+expiring.map(k=>byId[k].name).join('、')+'解除，其余保留':'当前没有按此示例回合结束的状态');persist();}});
root.querySelector('[data-speed]').onchange=e=>{speed=Number(e.target.value);if(playing){stop();say('速度已调整，可重新播放');}persist();};
function resize(){const b=fieldBox.getBoundingClientRect();canvas.width=Math.max(1,Math.round(b.width*devicePixelRatio));canvas.height=Math.max(1,Math.round(b.height*devicePixelRatio));ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
function point(el){const a=fieldBox.getBoundingClientRect(),b=el.getBoundingClientRect();return{x:b.x-a.x,y:b.y-a.y,w:b.width,h:b.height,cx:b.x-a.x+b.width/2,cy:b.y-a.y+b.height/2};}
function glow(x,y,r,c,alpha){if(r<=0||alpha<=0)return;ctx.save();ctx.globalAlpha=alpha;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.restore();}
const impact=new Image();impact.src=assets.impact;
function animate(ids){stop();if(!ids.length){say('先选择一种状态');return;}if(matchMedia('(prefers-reduced-motion: reduce)').matches){say('效果已呈现，全部徽记独立保留');return;}const el=field.querySelector(`[data-unit="${selected}"]`);if(!el)return;const cardRect=point(el.querySelector('.r-card')),pic=point(el.querySelector('.r-picture'));const marks=ids.map(id=>({id,p:point(el.querySelector(`[data-badge="${id}"]`))}));playing=true;phaseKey='';root.querySelector('[data-play]').disabled=true;root.querySelector('[data-play]').textContent='正在演出';start=performance.now();let last=0;function frame(now){if(!playing)return;const time=(now-start)*speed,box=fieldBox.getBoundingClientRect(),end=1700+marks.length*65;ctx.clearRect(0,0,box.width,box.height);const phase=time<300?'起势 · 军令汇聚':time<800?'命中 · 各效果独立抵达':time<1200?'数值变化 · 状态开始归位':time<end?'归位 · 每项收进自己的徽记':'完成 · 全部状态分别保留';if(phase!==phaseKey){root.querySelector('[data-phase]').textContent=phase;phaseKey=phase;}ctx.save();ctx.globalCompositeOperation='screen';marks.forEach(({id,p},i)=>{const e=byId[id],delay=i*65,age=time-delay,c=e.negative?(id==='freeze'?'#a3d9f5':'#c6a4d8'):e.target==='health'?'#a0e3b4':'#ebcd8c',peak=age-300;if(peak>0&&peak<600){const f=peak/600;glow(pic.cx,pic.cy,pic.w*(.2+f*.6),c,Math.sin(f*Math.PI)*.22/Math.sqrt(marks.length));if(i===0&&impact.complete&&impact.naturalWidth){ctx.save();ctx.globalAlpha=(1-f)*.5;const size=pic.w*(.4+f*.9);ctx.drawImage(impact,pic.cx-size/2,pic.cy-size/2,size,size);ctx.restore();}for(let j=0;j<10;j++){const a=j*2.399+i,dist=(10+f*pic.w*.55),x=pic.cx+Math.cos(a)*dist,y=pic.cy+Math.sin(a)*dist;ctx.globalAlpha=(1-f)*.65;ctx.fillStyle=c;ctx.fillRect(x,y,1.4+j%2,2.5);}}const f=(age-750)/600;if(f>=0&&f<=1){const q=1-Math.pow(1-f,3),x=pic.cx+(p.cx-pic.cx)*q,y=pic.cy+(p.cy-pic.cy)*q-Math.sin(q*Math.PI)*24;ctx.globalAlpha=Math.sin(f*Math.PI);ctx.beginPath();ctx.moveTo(x-3,y-10);ctx.quadraticCurveTo(x-9,y-22,x-12,y-30);ctx.strokeStyle=c;ctx.lineWidth=2;ctx.stroke();glow(x,y,8,c,.9);}const land=(age-1280)/390;if(land>=0&&land<=1){ctx.globalAlpha=Math.sin(land*Math.PI)*.8;ctx.strokeStyle=c;ctx.lineWidth=1.3;ctx.strokeRect(p.x-2,p.y-2,p.w+4,p.h+4);glow(p.cx,p.cy,18,c,Math.sin(land*Math.PI)*.5);}});ctx.restore();if(time<end){raf=requestAnimationFrame(frame);}else{stop();say('演出完成 · '+keys().length+' 项状态全部独立保留');}}raf=requestAnimationFrame(frame);}
function restore(s){if(!s)return;stop();const mc=s.modelContent??{},pc=s.privateContent??{};if(['single','board','stress'].includes(mc.scene))scene=mc.scene;if(units.some(u=>u.id===mc.selected))selected=mc.selected;if(Array.isArray(pc.units))for(const saved of pc.units){const u=units.find(v=>v.id===saved.id);if(u&&Array.isArray(saved.keys))u.keys=effects.map(e=>e.id).filter(k=>saved.keys.includes(k));}else if(Array.isArray(mc.activeStates))unit().keys=effects.map(e=>e.id).filter(k=>mc.activeStates.includes(k));if(byId[mc.focused])focused=mc.focused;if([.65,1,1.65].includes(pc.speed))speed=pc.speed;root.querySelector('[data-speed]').value=String(speed);render();}
render();restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});new ResizeObserver(()=>resize()).observe(fieldBox);
if(globalThis.Tweak){const design={frameTone:'#ba9e64'};const tweak=new Tweak({container:root,onChange:()=>root.style.setProperty('--r-gold',design.frameTone)});tweak.addColorPicker(design,'frameTone',{label:'旧铜强调色',reference:'--r-gold'});}
})();
</script>
</div>
</main></body></html>
