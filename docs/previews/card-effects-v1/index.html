function unit(label='前锋部队',attack=3,hp=4,max=7){return `<div class="playing-card unit"><div class="painting" style="background-image:url('${art.unit}')"></div><div class="card-name">${label}</div><div class="rules"><span class="original-rules">护卫 · 战阵中坚</span><br><span class="unit-state">尚未获得附加状态</span></div><div class="stats"><span class="stat-attack">⚔ ${attack}</span><span class="stat-health">♥ ${hp} / ${max}</span></div></div>`;}

function resize(){const r=arena.getBoundingClientRect();canvas.width=r.width*devicePixelRatio;canvas.height=r.height*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);if(!playing&&t>0)draw();}
function rect(el){const a=arena.getBoundingClientRect(),b=el.getBoundingClientRect();return {x:b.x-a.x,y:b.y-a.y,w:b.width,h:b.height,cx:b.x-a.x+b.width/2,cy:b.y-a.y+b.height/2};}
function line(x1,y1,x2,y2,color,width=2){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}

function burst(x,y,color,p,shape='ray'){if(p<0||p>1)return;ctx.save();ctx.globalAlpha=Math.sin(p*Math.PI);ctx.shadowColor=color;ctx.shadowBlur=(root.style.getPropertyValue("--preview-glow")?parseFloat(root.style.getPropertyValue("--preview-glow")):12);for(let i=0;i<14;i++){const a=i*Math.PI/7,r=12+p*55,px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;line(px,py,px+Math.cos(a)*10,py+Math.sin(a)*10,color,shape==='ice'?3:2);}ring(x,y,10+p*48,color,2);ctx.restore();}

function halo(x,y,r,color,alpha=1){ctx.save();ctx.globalAlpha=alpha;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.restore();}
function material(kind,b,amount=1){const img=vfxImages[kind];if(!img.complete||!img.naturalWidth)return;ctx.save();ctx.globalAlpha=amount;ctx.drawImage(img,b.x-15,b.y-21,b.w+30,b.h+42);ctx.restore();}
function embers(b,age,kind){if(age<0||age>1250)return;ctx.save();ctx.globalCompositeOperation='screen';for(let i=0;i<68;i++){const delay=(i%9)*13,q=cut((age-delay)/1050);if(q<=0||q>=1)continue;const angle=i*2.399963,speed=35+(i*17%75),x=b.cx+Math.cos(angle)*speed*q,y=b.y+b.h*.43+Math.sin(angle)*speed*q*1.2+q*q*24;ctx.globalAlpha=Math.pow(1-q,1.6);const color=kind==='ice'?(i%3?'#afdff7':'#f8fdff'):kind==='life'?(i%4?'#8ee9bf':'#eaffbc'):(i%4?'#edb85d':'#fff9db');if(i%4===0){halo(x,y,5,color,.8);ctx.fillStyle='#fffdf0';ctx.fillRect(x-1,y-1,2,2);}else{line(x,y,x-Math.cos(angle)*(2+q*9),y-Math.sin(angle)*(2+q*9),color,1+i%2*.5);}}ctx.restore();}
function impactWave(b,age,kind){if(age<0||age>650)return;const p=cut(age/650),cy=b.y+b.h*.43;ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=(1-p)*.65;ctx.strokeStyle=kind==='ice'?'#c4e7fb':'#f9daa0';ctx.lineWidth=(1-p)*9+.6;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=14;ctx.beginPath();ctx.ellipse(b.cx,cy,b.w*.3+p*b.w*.47,b.h*.15+p*b.h*.4,-.14,0,Math.PI*2);ctx.stroke();ctx.restore();}
function statPulse(b,age,health=false,negative=false){if(age<0||age>950)return;const q=cut(age/950),x=health?b.x+b.w-39:b.x+29,y=b.y+b.h-21,color=negative?'#e591b2':health?'#b5ffd2':'#ffe5a3';ctx.save();ctx.globalCompositeOperation='screen';halo(x,y,40,color,Math.sin(q*Math.PI)*.65);ctx.font='500 25px Georgia';ctx.textAlign='center';ctx.fillStyle=color;ctx.globalAlpha=Math.sin(q*Math.PI);ctx.shadowColor='#0c1511';ctx.shadowBlur=9;ctx.fillText(negative?'−2':health?'+3':'+2',x,y-24-q*28);ctx.restore();}
function buffCinematic(a,b){
 const stageRect=arena.getBoundingClientRect(),at=t-780,vital=t-1120,guard=t-1480;
 // The area darkens briefly to give the three impacts contrast without washing out the art.
 if(t>280&&t<2100){ctx.save();const g=ctx.createRadialGradient(b.cx,b.cy,40,b.cx,b.cy,stageRect.width*.8);g.addColorStop(0,'#08130d00');g.addColorStop(.6,'#08130d18');g.addColorStop(1,'#050a0866');ctx.fillStyle=g;ctx.globalAlpha=Math.sin(cut((t-280)/1820)*Math.PI);ctx.fillRect(0,0,stageRect.width,stageRect.height);ctx.restore();}
 // Twisting, tapered light ribbons converge from the source into the target.
 if(t>180&&t<850){const p=cut((t-180)/670),head=1-Math.pow(1-p,3);ctx.save();ctx.globalCompositeOperation='screen';for(let j=0;j<7;j++){ctx.beginPath();const x=a.cx+(b.cx-a.cx)*head,y=a.cy+(b.cy-a.cy)*head;ctx.moveTo(a.cx,a.cy+(j-3)*5);ctx.bezierCurveTo(a.cx+40,a.cy-50-j*5,x-55,y+40+j*4,x,y);ctx.strokeStyle=j===3?'#fff7d1':j%2?'#e7b65e':'#928454';ctx.globalAlpha=Math.sin(p*Math.PI)*(.75-j*.04);ctx.lineWidth=j===3?2.5:Math.max(1,7-j);ctx.shadowColor='#ffc777';ctx.shadowBlur=18;ctx.stroke();}ctx.restore();}
 // Gold blade-like shafts strike downwards in a compact bright flash.
 if(at>-200&&at<500){const p=cut((at+200)/700);ctx.save();ctx.globalCompositeOperation='screen';for(let i=0;i<11;i++){const x=b.cx+(i-5)*b.w*.065,y=b.y-35+p*50,w=i===5?17:2+i%3;ctx.globalAlpha=Math.sin(p*Math.PI)*.75;const g=ctx.createLinearGradient(0,y,0,b.y+b.h*.8);g.addColorStop(0,'transparent');g.addColorStop(.4,'#e1ac55');g.addColorStop(.7,'#fff5ca');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(x-w/2,y,w,b.h*.85);}halo(b.cx,b.y+b.h*.4,b.w*.78,'#ffdf9a',Math.sin(p*Math.PI)*.68);ctx.restore();}
 if(at>=0&&at<620&&vfxImages.impact.complete){const p=cut(at/620),size=b.w*(.65+Math.pow(p,.45)*1.15);ctx.save();ctx.globalAlpha=Math.pow(1-p,1.25)*.95;ctx.globalCompositeOperation='screen';ctx.drawImage(vfxImages.impact,b.cx-size/2,b.y+b.h*.4-size/2,size,size);ctx.restore();}embers(b,at,'gold');statPulse(b,at);
 // Health comes as an emerald vortex wrapping the lower right and rising through the card.
 if(vital>-100&&vital<1000){const p=cut((vital+100)/1100);ctx.save();ctx.globalCompositeOperation='screen';for(let j=0;j<5;j++){ctx.globalAlpha=Math.sin(p*Math.PI)*(.5-j*.06);ctx.strokeStyle=j%2?'#b9f4d4':'#639f8c';ctx.lineWidth=1.3+j*.7;ctx.beginPath();for(let k=0;k<75;k++){const q=k/74,angle=q*6.2+p*3.2+j*.08,x=b.cx+Math.cos(angle)*b.w*(.52-.17*q),y=b.y+b.h*.83-q*b.h*.63; k?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();}halo(b.x+b.w*.8,b.y+b.h*.78,75,'#9ee5b6',Math.sin(p*Math.PI)*.42);ctx.restore();}embers(b,vital,'life');statPulse(b,vital,true);
 // The material settles from a larger refracted shell to its exact rectangular fit.
 if(guard>=0){const p=cut(guard/540),scale=1+(1-p)*.12;ctx.save();ctx.translate(b.cx,b.cy);ctx.scale(scale,scale);ctx.translate(-b.cx,-b.cy);material('shield',b,.25+.75*p);ctx.restore();impactWave(b,guard,'gold');}
}
function negativeCinematic(b){const age=t-1500;if(age<0)return;const p=cut(age/650);ctx.save();ctx.beginPath();ctx.rect(b.x-25,b.y-30,(b.w+50)*p,b.h+60);ctx.clip();material('ice',b,.4+.6*p);ctx.restore();embers(b,age,'ice');impactWave(b,age,'ice');statPulse(b,t-1770,false,true);
 // A smoke veil settles over the skill strip only, with an embossed, crossed wax seal.
 if(t>2020){const q=cut((t-2020)/500),y=b.y+b.h*.74;ctx.save();ctx.globalAlpha=q;const g=ctx.createLinearGradient(b.x+10,y,b.x+b.w-10,y);g.addColorStop(0,'transparent');g.addColorStop(.2,'#211e2d9c');g.addColorStop(.8,'#211e2d9c');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(b.x+10,y-12,b.w-20,28);ctx.translate(b.x+b.w-24,b.y+b.h*.65);const wax=ctx.createRadialGradient(-3,-5,1,0,0,13);wax.addColorStop(0,'#a294ac');wax.addColorStop(.4,'#6a5b77');wax.addColorStop(.75,'#3b354a');wax.addColorStop(1,'#9b8aa0');ctx.fillStyle=wax;ctx.beginPath();for(let i=0;i<24;i++){const a=i*Math.PI/12,r=i%2?12:13.5;i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fill();ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.strokeStyle='#b2a3ba77';ctx.lineWidth=.7;ctx.stroke();line(-4,-3,4,3,'#e8e0ed',1.5);line(4,-3,-4,3,'#e8e0ed',1.5);ctx.restore();}
}

function stateMark(b){if(mode==='debuff'){negativeCinematic(b);const age=t-1500;target.querySelector('.painting').style.transform=age>0&&age<420?`translateX(${Math.sin(age*.065)*3*(1-age/420)}px)`:'none';}}
function update(){const c=cards.find(c=>c.id===selected),hit=t>=1800;let p=t<500?'起手':t<1100?'施放':t<1800?'抵达目标':t<2600?'效果命中':'状态留驻';
 if(mode==='buff'){if(t>=780){target.querySelector('.stat-attack').textContent='⚔ 5';target.firstElementChild.classList.add('attack-enhanced');}if(t>=1120)target.querySelector('.stat-health').textContent='♥ 7 / 10';if(t>=2020){target.querySelector('.stat-attack').textContent='⚔ 5';target.querySelector('.stat-health').textContent='♥ 7 / 10';target.querySelector('.unit-state').textContent='属性强化 · 护盾已获得';ts.innerHTML=chip('攻击 +2')+chip('生命上限 +3')+chip('护甲盾');}p=t<700?'军令汇聚 · 起势':t<1120?'金色冲击 · 攻击提升':t<1480?'生机旋流 · 生命强化':t<2100?'护盾爆发 · 能量封合':'增益完成 · 护甲盾持续';}
 if(mode==='debuff'){if(hit){target.querySelector('.stat-attack').textContent='⚔ 1';target.querySelector('.unit-state').textContent='无法攻击 · 原技能移除';target.firstElementChild.classList.add('frozen','silenced');ts.innerHTML=chip('冻结',true)+chip('攻击 −2',true)+chip('沉默',true);}p=t<1100?'封禁军令 · 蓄势':t<1800?'冰棱 / 断刃 / 封印分别抵达':t<2600?'冰封 / 虚弱 / 沉默落地':'冰壳冻结 · 攻击削弱 · 沉默封印';}
 if(mode==='secret'){if(t>700&&!reveal){source.innerHTML=face(c);reveal=true;}ss.innerHTML=chip(t<700?'密封 · 未知奥秘':t<1800?'触发 · 揭示':'已触发');if(hit){ts.innerHTML=selected==='watch'?chip('护甲 +3'):chip('受到 3 点伤害',true);if(selected==='ambush')target.querySelector('.stat-health').textContent='♥ 4 / 7';}p=t<700?'敌方攻击接近 · 密令感应':t<1400?'封印开启 · 揭示奥秘':t<2200?(selected==='watch'?'甲片扣合 · 主将获得护甲':'引线点亮 · 弩矢命中攻击者'):'奥秘结算完成 · 原攻击继续（本例攻击者存活）';}
 if(mode==='weapon'){ss.innerHTML=chip(t<900?'装备中':t<1800?'已装备 · 可攻击':t<3600?'耐久 ◆◇ · 本回合已攻击':'耐久耗尽');if(hit){target.querySelector('.stat-health').textContent=selected==='blade'?'♥ 2 / 7':'♥ 1 / 7';ts.innerHTML=chip(selected==='blade'?'斩击 −2':'穿刺 −3',true);}p=t<900?'武器入槽 · 装备':t<1400?'主将起手':t<2000?(selected==='blade'?'弧形刀斩 · 命中':'长枪直刺 · 命中'):t<3300?'消耗 1 耐久 · 本回合已攻击':t<3900?'演示跳至下一次攻击 · 余下耐久耗尽':'武器耗尽 · 退场';source.firstElementChild.classList.toggle('ended',t>3900);if(t>3600){target.querySelector('.stat-health').textContent='♥ 0 / 7';ts.innerHTML=chip('第二次攻击 · 目标阵亡',true);}}
 if(mode==='landmark'){ss.innerHTML=t<900?chip('部署中'):t<1800?chip('可用 · 2 次'):t<3300?chip('剩余 1 次')+chip('冷却中'):t<4200?chip('隔过一个己方回合后就绪'):chip('次数耗尽 · 退场');if(hit){if(selected==='camp'){target.querySelector('.stat-health').textContent='♥ 7 / 7';ts.innerHTML=chip('恢复 3 生命');}else{target.querySelector('.stat-attack').textContent='⚔ 5';ts.innerHTML=chip('攻击 +2 · 本回合');}}if(t>3300&&selected==='camp'&&t<3900){target.querySelector('.stat-health').textContent='♥ 4 / 7';ts.innerHTML=chip('后续回合 · 友军再次受伤',true);}if(t>4200)ss.innerHTML=chip('剩余 0 次 · 耗尽');source.firstElementChild.classList.toggle('ended',t>4500);p=t<900?'基座落稳 · 建筑部署':t<1400?(selected==='camp'?'营灯亮起':'令鼓响起 · 旗面展开'):t<2000?(selected==='camp'?'补给流抵达 · 生命恢复':'号令波抵达 · 临时加攻'):t<3300?'次数 −1 · 进入冷却':t<3900?'演示快进 · 隔过一个己方回合后就绪':t<4500?'第二次发动 · 最后一次效果落地':'次数耗尽 · 收帐 / 降旗';}
 if(p!==lastPhase){phase.textContent=p;lastPhase=p;}}
function draw(){const box=arena.getBoundingClientRect();ctx.clearRect(0,0,box.width,box.height);ctx.font='500 14px sans-serif';ctx.textAlign='center';let a=rect(source.firstElementChild);const b=rect(target.firstElementChild);if(!a.w)a={cx:b.x-25,cy:b.y+45,x:b.x-25,y:b.y+45,w:0,h:0};if(clearing){burst(b.cx,b.cy,'#bdcdbf',Math.min(1,t/900));return;}if(mode==='buff'){const wave=(s,d)=>Math.sin(cut((t-s)/d)*Math.PI);const bump=wave(780,380)*.075+wave(1120,340)*.035+wave(1480,380)*.045;target.querySelector('.painting').style.transform=`translateY(${-bump*35}px) scale(${1+bump})`;buffCinematic(a,b);return;}stateMark(b);
 const color=mode==='debuff'?'#a3dff0':mode==='weapon'?'#f1d6a5':selected==='camp'?'#9ee2bd':'#e6bd70';
 if(t<1100){ctx.globalAlpha=Math.sin(Math.min(1,t/1100)*Math.PI)*.8;ring(a.cx,a.cy,35+t*.045,color,2);ctx.globalAlpha=1;}
 if(mode==='buff'||mode==='debuff'){const list=mode==='buff'?[['#edb268',b.x+25,b.y+b.h-20,'攻击 +2'],['#91dfab',b.x+b.w-37,b.y+b.h-20,'生命上限 +3'],['#f6dd97',b.cx,b.cy,'护甲盾']]:[['#a8e8f7',b.x+12,b.y+18,'冻结'],['#d38989',b.x+25,b.y+b.h-20,'攻击 −2'],['#b6a2d6',b.cx,b.y+23,'沉默']];list.forEach(([c,x,y,s],i)=>{travel(a,{cx:x,cy:y},(t-900-i*90)/650,c);burst(x,y,c,(t-1550-i*90)/900);if(t>1750+i*90&&t<2700+i*90)label(s,x,Math.max(22,y-24-(i===2?20:0)),c);});}
 else if(mode==='weapon'){if(t>1000&&t<2300){const p=(t-1000)/1300;if(selected==='spear'){travel(a,b,Math.min(1,p*2),'#e6ece0','spear');if(p>.45)line(b.cx-45,b.cy+18,b.cx+42,b.cy-18,'#e9f5ec',4);}else{ctx.save();ctx.strokeStyle='#f6dfb1';ctx.shadowColor='#e9bb6c';ctx.shadowBlur=15;ctx.lineWidth=7;ctx.beginPath();ctx.ellipse(b.cx,b.cy,55,70,-.6,-1.8,-1.8+Math.min(1,p*1.8)*3.9);ctx.stroke();ctx.restore();}burst(b.cx,b.cy,'#ebc884',(t-1650)/650);}if(t>3300&&t<4100){travel(a,b,(t-3300)/400,'#f1d6a5','spear');burst(b.cx,b.cy,'#ebc884',(t-3600)/650);}if(t>3900)burst(a.cx,a.cy,'#c2b49a',(t-3900)/700);}
 else{travel(a,b,(t-1100)/650,color);burst(b.cx,b.cy,color,(t-1650)/1000,mode==='secret'?'ice':'ray');if(mode==='secret'&&selected==='watch'&&t>1800){for(let i=0;i<3;i++){ctx.fillStyle='#9fc3d0';ctx.fillRect(b.cx-30+i*24,b.y+b.h*.57,17,9);}label('护甲 +3',b.cx,b.y+35,'#c7e4ed');}if(mode==='secret'&&selected==='ambush'&&t>1100&&t<1800){for(let i=0;i<3;i++)travel({...a,cy:a.cy+i*14},{...b,cy:b.cy+i*10},(t-1100-i*60)/500,'#e9c294','spear');}if(mode==='landmark'&&t>3900&&t<4500){travel(a,b,(t-3900)/400,color);burst(b.cx,b.cy,color,(t-4200)/600);}}
}
function play(){if(matchMedia('(prefers-reduced-motion: reduce)').matches){render();t=mode==='landmark'?5100:mode==='weapon'?4600:3400;update();draw();root.querySelector('[data-play]').textContent='重新播放';return;}if(playing){playing=false;cancelAnimationFrame(raf);root.querySelector('[data-play]').textContent='继续播放';return;}if(t===0||t>=(mode==='landmark'?5100:mode==='weapon'?4600:3400)||clearing){render();}playing=true;start=performance.now()-t/speed;root.querySelector('[data-play]').textContent='暂停';function frame(now){t=(now-start)*speed;update();draw();const end=mode==='landmark'?5100:mode==='weapon'?4600:3400;if(t<end&&playing)raf=requestAnimationFrame(frame);else{playing=false;root.querySelector('[data-play]').textContent='重新播放';}}raf=requestAnimationFrame(frame);}
root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;const found=cards.find(c=>c.id===selected);if(!['buff','debuff'].includes(mode)&&found.type!==mode)selected=cards.find(c=>c.type===mode).id;render();persist();});
root.querySelector('.choices').innerHTML=cards.map(c=>`<button class="choice" data-card="${c.id}" aria-pressed="false"><div class="choice-art" style="background-image:url('${art[c.id]}')"></div><span>${c.name}</span><small>${{secret:'奥秘',weapon:'武器',landmark:'地标'}[c.type]}</small></button>`).join('');root.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{selected=b.dataset.card;mode=cards.find(c=>c.id===selected).type;render();persist();});
root.querySelector('[data-play]').onclick=play;root.querySelector('[data-finish]').onclick=()=>{cancelAnimationFrame(raf);playing=false;clearing=false;t=mode==='landmark'?5100:mode==='weapon'?4600:3400;update();draw();root.querySelector('[data-play]').textContent='重新播放';};root.querySelector('select').onchange=e=>{speed=Number(e.target.value);if(playing)start=performance.now()-t/speed;persist();};root.querySelector('[data-clear]').onclick=()=>{cancelAnimationFrame(raf);playing=false;clearing=true;t=0;ss.innerHTML='';ts.innerHTML='';target.querySelector('.playing-card').classList.remove('frozen','silenced','attack-enhanced');target.firstElementChild.style.transform='none';target.querySelector('.painting').style.transform='none';phase.textContent=mode==='buff'||mode==='debuff'?'附加效果解除 · 属性还原':'演示结束 · 来源退场';target.querySelector('.stat-attack').textContent='⚔ 3';target.querySelector('.stat-health').textContent='♥ 4 / 7';target.querySelector('.unit-state').textContent='附加状态已解除';if(!['buff','debuff'].includes(mode))source.firstElementChild.classList.add('ended');root.querySelector('[data-play]').textContent='重新播放';const s=performance.now();function clear(now){t=now-s;draw();if(t<900)raf=requestAnimationFrame(clear);else ctx.clearRect(0,0,canvas.width,canvas.height);}raf=requestAnimationFrame(clear);};
function persist(){window.openai?.setWidgetState?.({modelContent:{mode,card:selected},privateContent:{speed}})?.catch(()=>{});}
function restore(s){if(s?.modelContent){if(['buff','debuff','secret','weapon','landmark'].includes(s.modelContent.mode))mode=s.modelContent.mode;if(cards.some(c=>c.id===s.modelContent.card))selected=s.modelContent.card;const c=cards.find(c=>c.id===selected);if(!['buff','debuff'].includes(mode)&&c.type!==mode)selected=cards.find(c=>c.type===mode).id;}render();}render();window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});new ResizeObserver(resize).observe(arena);Promise.all(Object.values(vfxImages).map(i=>i.decode().catch(()=>{}))).then(()=>{if(mode==='buff'&&!playing&&t===0){t=3400;update();draw();root.querySelector('[data-play]').textContent='播放演出';}});
if(globalThis.Tweak){const design={glow:12};const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--preview-glow',design.glow+'px');}});tweak.addSlider(design,'glow',{label:'光效强度',min:0,max:24,unit:'px'});}
})();
