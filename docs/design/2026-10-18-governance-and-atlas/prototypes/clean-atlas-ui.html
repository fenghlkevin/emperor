<div id="clean-atlas">
<style>
#clean-atlas{--paper:light-dark(#f6f1e6,#242721);--map:light-dark(#eceee7,#1e2523);--ink:light-dark(#302f29,#ece8dc);--muted:light-dark(#686b60,#afb6a8);--line:light-dark(#d7d6c9,#485045);--land:light-dark(#e1dfc9,#424d3c);--selected:light-dark(#d1b98c,#766142);--red:light-dark(#8d4032,#e5a38b);--green:light-dark(#406454,#9abfa3);--panel:light-dark(#fffaf0,#2d3029);color:var(--ink);font:14px/1.65 system-ui;background:var(--paper)}
#clean-atlas *{box-sizing:border-box}#clean-atlas header{padding:22px 26px;display:flex;align-items:center;gap:22px;border-bottom:1px solid var(--line);padding-right:110px}#clean-atlas .seal{color:var(--red);border:1px solid var(--red);padding:3px 8px;font-family:serif;font-size:22px}#clean-atlas h2{font:500 23px/1.3 serif;margin:0}#clean-atlas small{font-size:12px;color:var(--muted)}#clean-atlas .date{margin-left:auto;white-space:nowrap}#clean-atlas .tools{display:flex;align-items:center;flex-wrap:wrap;gap:9px;padding:14px 26px}#clean-atlas button{font:inherit;background:transparent;color:var(--ink);padding:7px 13px;border:1px solid var(--line);border-radius:4px}#clean-atlas button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}#clean-atlas button:focus-visible{outline:2px solid var(--red);outline-offset:3px}#clean-atlas .body{display:grid;grid-template-columns:minmax(0,3.3fr) minmax(210px,1fr);border-top:1px solid var(--line)}#clean-atlas .canvas{background:var(--map);position:relative;min-width:0;padding:18px 12px 10px}#clean-atlas .map-heading{display:flex;justify-content:space-between;padding:0 12px;gap:10px}#clean-atlas svg{display:block;width:100%;height:470px}#clean-atlas .province{fill:var(--land);stroke:var(--paper);stroke-width:2;stroke-linejoin:round}#clean-atlas .province.selected{fill:var(--selected);stroke:var(--red);stroke-width:2.5}#clean-atlas .province.source{fill:var(--land);stroke:var(--green);stroke-width:2.5}#clean-atlas .province.risk{fill:color-mix(in srgb,var(--red) 16%,var(--land))}#clean-atlas .region-name{fill:var(--ink);font:500 15px system-ui;paint-order:stroke;stroke:var(--map);stroke-width:4px;stroke-linejoin:round}#clean-atlas .status{fill:var(--red);font:12px system-ui;paint-order:stroke;stroke:var(--map);stroke-width:3px}#clean-atlas .water{fill:var(--muted);font:14px serif;letter-spacing:5px}#clean-atlas .route{stroke:var(--green);stroke-width:3;stroke-dasharray:7 6;fill:none}#clean-atlas .legend{display:flex;gap:20px;flex-wrap:wrap;padding:12px;color:var(--muted);font-size:12px}#clean-atlas .legend span{display:flex;gap:7px;align-items:center}#clean-atlas .dot{width:9px;height:9px;border-radius:50%;background:var(--red)}#clean-atlas .dot.source{background:var(--green)}#clean-atlas aside{background:var(--panel);padding:22px 20px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:17px;min-width:0}#clean-atlas aside h3{font:500 28px serif;margin:0}#clean-atlas aside h4{font-size:14px;font-weight:500;margin:0 0 9px}#clean-atlas p{margin:6px 0}#clean-atlas dl{margin:0}#clean-atlas dl>div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}#clean-atlas dt{color:var(--muted)}#clean-atlas dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}#clean-atlas .issue{border-left:2px solid var(--red);padding-left:12px}#clean-atlas .issue strong{font-weight:500;color:var(--red)}#clean-atlas .actions{display:grid;gap:9px;margin-top:auto}#clean-atlas .primary{background:var(--red);color:var(--paper);border-color:var(--red)}#clean-atlas footer{padding:12px 26px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}#clean-atlas .region-picker{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}#clean-atlas .region-picker button{font-size:12px;padding:3px 8px}#clean-atlas .message{font-size:12px;color:var(--muted);min-height:40px}#clean-atlas .route-controls{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px 8px}#clean-atlas .route-controls select{font:inherit;padding:5px;color:var(--ink);background:var(--paper);border:1px solid var(--line)}
#clean-atlas [hidden]{display:none!important}#clean-atlas button:disabled{opacity:.5}
@media(max-width:650px){#clean-atlas .body{grid-template-columns:1fr}#clean-atlas aside{border-left:0;border-top:1px solid var(--line)}#clean-atlas header{padding:18px;flex-wrap:wrap;gap:12px}#clean-atlas .date{margin-left:0}#clean-atlas .tools{padding:12px}#clean-atlas svg{height:370px}#clean-atlas footer{padding:12px}#clean-atlas .map-heading{flex-direction:column}#clean-atlas .region-name{font-size:13px}}
@media(pointer:coarse){#clean-atlas button{min-height:44px}#clean-atlas .route-controls select{min-height:44px}}
</style>
<header><span class="seal">舆</span><div><h2>天下舆图</h2><small>治天下 · 察州情 · 核实务</small></div><span class="date">全国 · 本国十州</span></header>

<div class="body"><section class="canvas" aria-label="全国地图"><div class="map-heading"><span id="map-title">全国治理 · 州郡与待决事项</span><small>平色底图 · 无山川纹理</small></div><svg id="atlas-svg" role="img" aria-label="本国十州疆域，点击图下州名选择地区"></svg><div id="route-controls" class="route-controls" hidden><label>调出州 <select id="source-select"></select></label><small>虚线为拟议路线，尚未执行</small></div><div class="legend"><span><i class="dot"></i><span id="legend-text">有待决事项</span></span><span><i class="dot source"></i><span id="secondary-legend">已委任治理</span></span></div><div class="region-picker" id="region-picker" aria-label="选择州郡"></div></section>

<footer><span>疆域沿用现有游戏数据 · 轮廓待优化</span><span>实际 / 预测 / 拟议分开呈现</span></footer>

<script>
(()=>{const root=document.getElementById('clean-atlas'),q=id=>root.querySelector('#'+id),data=JSON.parse(q('atlas-data').textContent),ns='http://www.w3.org/2000/svg';let state={layer:'governance',province:'hebei',source:'henan'};
const names=Object.fromEntries(data.map(p=>[p.id,p.name]));
function svg(tag,attrs,text){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text)e.textContent=text;return e;}
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{cleanAtlas:state}}).catch(()=>{});}
function render(){const w=Math.max(260,q('atlas-svg').getBoundingClientRect().width),h=w<450?370:470;q('atlas-svg').setAttribute('viewBox',`0 0 ${w} ${h}`);const scale=Math.min((w-34)/30,(h-48)/24),x=v=>(v-94)*scale+(w-30*scale)/2,y=v=>(43-v)*scale+(h-24*scale)/2;const scene=q('atlas-svg');scene.replaceChildren();
data.forEach(p=>{let cls='province';if(p.id==='hebei'&&state.layer!=='grain')cls+=' risk';if(p.id===state.province)cls+=' selected';if(state.layer==='grain'&&p.id===state.source&&p.id!==state.province)cls+=' source';const path=svg('path',{d:p.polygon.map((v,i)=>`${i?'L':'M'}${x(v[0])},${y(v[1])}`).join('')+'Z',class:cls});path.addEventListener('click',()=>{state.province=p.id;render();save();});scene.append(path);});
if(state.layer==='grain'&&state.source!==state.province){const a=data.find(p=>p.id===state.source).center,b=data.find(p=>p.id===state.province).center;scene.append(svg('path',{d:`M${x(a[0])},${y(a[1])} Q${x((a[0]+b[0])/2)-30},${y((a[1]+b[1])/2)} ${x(b[0])},${y(b[1])}`,class:'route'}));scene.append(svg('circle',{cx:x(b[0]),cy:y(b[1]),r:5,fill:'var(--green)'}));}
data.forEach(p=>{const [a,b]=p.center;scene.append(svg('text',{x:x(a),y:y(b)-3,'text-anchor':'middle',class:'region-name'},p.name));const label=p.id==='hebei'?(state.layer==='army'?'缺装20份':state.layer==='grain'?'预计缺粮':'待决1件'):state.layer==='grain'&&p.id===state.source?'调出州':'';if(label)scene.append(svg('text',{x:x(a),y:y(b)+17,'text-anchor':'middle',class:'status'},label));});
if(w>450)scene.append(svg('text',{x:w-27,y:h*.66,'text-anchor':'end',class:'water'},'海域'));
q('province-name').textContent=names[state.province];q('route-controls').hidden=state.layer!=='grain';q('source-select').value=state.source;
root.querySelectorAll('[data-layer]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.layer===state.layer));root.querySelectorAll('[data-province]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.province===state.province));
const hebei=state.province==='hebei',config={governance:{title:'全国治理 · 州郡与待决事项',subtitle:'地方文武分治',facts:[['民政治权','州牧治理'],['军务治权','将军治理'],['民政额度','600 两 / 旬'],['军务额度','300 两 / 旬']],issue:hebei?'赈济追加待批':'日常治理中',detail:hebei?'地方已在额度内救济，仍有缺口，已呈户部核办。':'例行事务自动办理；实支与暂缓原因记入执行簿。',owner:'州牧、将军执行；重大事项转中央主管部门。',action:'核阅关联奏事',legend:'有待决事项',secondary:'选中州为深色'},grain:{title:'钱粮调运 · 先选调入，再选调出',subtitle:'粮食预测与拟议调运',facts:[['实有存粮','1,200 石'],['下旬预计缺口',hebei?'400 石':'暂无缺口'],['拟议调出',names[state.source]],['拟议调入',names[state.province]]],issue:state.source===state.province?'请选择不同调出州':'路线待核定',detail:'来源安全储备、可调余粮与目标需求，在拟旨时统一核验。',owner:'户部尚书核办；两地州牧奉旨落实。',action:'拟定调粮方案',legend:'粮食缺口 / 调入州',secondary:'调出州 · 虚线为拟议路线'},army:{title:'地方军务 · 驻军与兵装缺口',subtitle:'保持既定兵种与现有驻军',facts:[['现有驻军','600 人'],['可用兵装',hebei?'580 份':'600 份'],['待补缺装',hebei?'20 份':'0 份'],['军务额度','300 两 / 旬']],issue:hebei?'将军可自主补齐':'配装目标已满足',detail:hebei?'刀盾兵缺装20份，示例费用240两；额度内办理，不新增兵员。':'停止新增采购；预算余额保留。',owner:'地方将军执行；扩军、跨州调兵转兵部上奏。',action:'查看补装计划',legend:'有兵装缺口',secondary:'选中州为深色'}}[state.layer];
q('map-title').textContent=config.title;q('province-subtitle').textContent=config.subtitle;q('facts').replaceChildren(...config.facts.map(([k,v])=>{const row=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v;row.append(dt,dd);return row;}));q('issue-title').textContent=config.issue;q('issue-detail').textContent=config.detail;q('owner-detail').textContent=config.owner;q('main-action').textContent=config.action;q('legend-text').textContent=config.legend;q('secondary-legend').textContent=config.secondary;
q('main-action').disabled=state.layer==='grain'&&state.source===state.province;
}
data.forEach(p=>{const b=document.createElement('button');b.type='button';b.textContent=p.name;b.dataset.province=p.id;b.onclick=()=>{state.province=p.id;q('message').textContent='已定位'+p.name+'，可核阅专题详情。';render();save();};q('region-picker').append(b);const o=document.createElement('option');o.value=p.id;o.textContent=p.name;q('source-select').append(o);});
root.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>{state.layer=b.dataset.layer;q('message').textContent='专题已切换，保持当前选州。';render();save();});q('source-select').onchange=()=>{state.source=q('source-select').value;render();save();};
q('main-action').onclick=()=>q('message').textContent=state.layer==='grain'?'拟旨预览：'+names[state.source]+' → '+names[state.province]+'；数量与实际可调库存待核定，尚未执行。':state.layer==='army'?'补装计划：按实际缺口采购，保留兵种配置、费用与执行结果。':'关联奏事：户部主办，州牧执行；可追加、改议或留中。';q('secondary-action').onclick=()=>q('message').textContent='执行簿：展示本州实支、实际变化和暂缓原因；不重复执行事项。';
function restore(s){const saved=s?.modelContent?.cleanAtlas;if(saved&&names[saved.province]&&names[saved.source]&&['governance','grain','army'].includes(saved.layer))state={...saved};render();}restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));new ResizeObserver(render).observe(q('atlas-svg'));
})();
</script>
